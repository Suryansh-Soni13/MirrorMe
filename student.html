<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARUSAT Attendance - CAUE 501</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header" style="justify-content: center; position: relative;">
            <h2 style="font-size: 1.2rem; color: #5f6368;">Hello, <span id="student-name" style="color: var(--primary);">...</span> 👋</h2>
        </div>
        
        <div id="scanner-section" style="text-align: center;">
            <h3 style="margin-bottom: 5px;">📷 Scan to mark attendance</h3>
            <p style="color: #5f6368; font-size: 13px; margin-bottom: 20px;">Point your camera at the QR code displayed by your professor.</p>
            
            <div id="qr-reader" style="width: 100%; max-width: 400px; margin: auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border: 4px solid var(--primary);"></div>
            
            <div id="zoom-controls" class="hidden" style="margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; background: #f8f9fa; padding: 10px 15px; border-radius: 20px;">
                <span style="font-size: 18px;">🔍</span>
                <input type="range" id="zoom-slider" min="1" max="5" value="1" step="0.1" style="width: 70%; cursor: pointer; margin: 0;">
            </div>
            
            <button id="logout-btn" class="secondary-btn" style="margin-top: 40px; padding: 10px; font-size: 13px; width: auto; border: none; color: var(--danger);">Logout</button>
        </div>

        <div id="success-section" class="hidden" style="text-align: center;">
            <div style="font-size: 50px; margin-bottom: 10px;">✅</div>
            <h2 style="color: var(--success); margin-bottom: 5px;">Scan Successful!</h2>
            <p style="color: #5f6368; font-size: 14px;">Your details are locked in.</p>
            
            <div class="student-details" style="text-align: left; background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; border-radius: 12px; padding: 20px; margin: 25px 0; box-shadow: 0 8px 16px rgba(26,115,232,0.2);">
                <p style="margin: 0 0 10px 0; opacity: 0.8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Student Digital ID</p>
                <p style="font-size: 20px; font-weight: bold; margin: 0 0 5px 0;"><span id="display-name"></span></p>
                <div style="display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px;">
                    <div>
                        <p style="font-size: 10px; opacity: 0.8; margin: 0;">ROLL NO</p>
                        <p style="font-weight: bold; margin: 0; font-family: monospace; font-size: 16px;"><span id="display-id"></span></p>
                    </div>
                    <div style="text-align: right;">
                        <p style="font-size: 10px; opacity: 0.8; margin: 0;">DIVISION</p>
                        <p style="font-weight: bold; margin: 0;"><span id="display-div"></span></p>
                    </div>
                </div>
            </div>
            
            <div id="countdown-text" style="background: #e8f0fe; color: #1967d2; padding: 10px; border-radius: 8px; font-weight: 500;">
                Submitting attendance in <span id="timer" style="font-weight: bold; font-size: 18px;">3</span>s...
            </div>
            <h3 id="attendance-done" class="hidden" style="color: var(--success); background: #e6f4ea; padding: 10px; border-radius: 8px;">🎉 Attendance Submitted!</h3>
        </div>
        
        <div id="loading-indicator" class="hidden">Processing...</div>
    </div>
    
    <!-- HTML5 QR Code Library (Minified for less data and faster loading) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/student.js"></script>
</body>
</html>
